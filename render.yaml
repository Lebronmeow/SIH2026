# Render blueprint for the ORCA backend (free tier).
# Deploy: Render dashboard → New → Blueprint → point at this repo (branch main).
# The backend URL this creates becomes the rewrite target in frontend/vercel.json
# (and the VITE_API_BASE build env, if you route via env instead of the proxy).
services:
  - type: web
    name: orca-backend
    runtime: docker
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/system/status
    envVars:
      - key: ORCA_DATA_MODE
        value: live
      # Update after the frontend deploy: add your vercel.app origin here.
      - key: ORCA_CORS_ORIGINS
        value: '["http://localhost:5173"]'
      # LLM reasoning — Gemini free tier via its OpenAI-compatible endpoint.
      # The API key is the only secret: Render prompts for it once (sync:false);
      # it is NEVER committed here.
      - key: ORCA_LLM_PROVIDER
        value: openai-compatible
      - key: ORCA_LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: ORCA_LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: ORCA_LLM_API_KEY
        sync: false